version: '3.8'

services:
  api:
    build: .
    container_name: debrisnet-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: debrisnet-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
